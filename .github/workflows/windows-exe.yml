name: Windows exe

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build agent (console)
        run: pyinstaller --noconfirm --onefile --console --name TokenPulse-Agent --add-data "web;web" agent.py

      - name: Build widget (no console)
        run: pyinstaller --noconfirm --onefile --windowed --name TokenPulse-Widget widget.py

      - name: Package
        shell: pwsh
        run: |
          $out = "TokenPulse-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item dist\TokenPulse-Agent.exe, dist\TokenPulse-Widget.exe, start-monitor.bat, README.md, LICENSE $out
          @"
          TokenPulse для Windows. Python ставить не нужно.

          TokenPulse-Agent.exe  - запускается на ПК с видеокартой (сервер), отдаёт метрики на http://IP:8787/
                                  Аргументы как у agent.py, например: TokenPulse-Agent.exe --engine http://127.0.0.1:1234
          TokenPulse-Widget.exe - виджет на любом компьютере: TokenPulse-Widget.exe --server http://192.168.31.30:8787
                                  Адрес запоминается, дальше достаточно двойного щелчка.
          start-monitor.bat     - веб-монитор со скинами отдельным окном Edge/Chrome: start-monitor.bat http://IP:8787

          Если Windows SmartScreen предупреждает о неизвестном издателе: "Подробнее" -> "Выполнить в любом случае".
          "@ | Out-File -Encoding utf8 "$out\README-Windows.txt"
          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TokenPulse-windows
          path: TokenPulse-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TokenPulse-windows.zip
            dist/TokenPulse-Agent.exe
            dist/TokenPulse-Widget.exe
